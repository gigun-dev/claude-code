name: upstream-skills

# Weekly: compare each vendored skill with upstream HEAD (vendor/upstream-skills.json)
# and open a PR that re-copies changed skills and bumps the pinned SHA.
# The PR is never merged automatically. Local dry-run:
#   python3 scripts/sync_upstream_skills.py --dry-run

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-copy changed skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_upstream_skills.py --write --report "$RUNNER_TEMP/body.md"
      - name: Regenerate manifests
        run: python3 scripts/generate_manifests.py --write
      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "no change"; exit 0; fi
          branch="chore/upstream-skills-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A vendor plugins .claude-plugin .agents
          git commit -m "chore(vendor): update upstream skills"
          git push origin "$branch"
          body="$RUNNER_TEMP/body.md"
          [ -s "$body" ] || echo "Upstream pin updated; skill contents unchanged." > "$body"
          gh pr create --title "chore(vendor): update upstream skills" --body-file "$body" --base "${{ github.event.repository.default_branch }}" --head "$branch"
